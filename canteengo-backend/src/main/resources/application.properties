# Server Port
server.port=8080
canteengo.jwt.secret=${CANTEENGO_JWT_SECRET:local-development-only-change-this-secret-before-deployment-0123456789}
canteengo.cors.allowed-origins=${CANTEENGO_ALLOWED_ORIGINS:*}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/canteengo_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect